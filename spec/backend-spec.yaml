spec:
  containers:
    - name: backend
      image: /spcs_app_db/app_schema/app_images/spcs-backend:latest
      secrets:
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.app_config_warehouse
          secretKeyRef: secret_string
          envVarName: SNOWFLAKE_WAREHOUSE
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.app_config_database
          secretKeyRef: secret_string
          envVarName: SNOWFLAKE_DATABASE
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.app_config_schema
          secretKeyRef: secret_string
          envVarName: SNOWFLAKE_SCHEMA
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.sso_provider
          secretKeyRef: secret_string
          envVarName: SSO_PROVIDER
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.sso_client_id
          secretKeyRef: secret_string
          envVarName: SSO_CLIENT_ID
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.sso_client_secret
          secretKeyRef: secret_string
          envVarName: SSO_CLIENT_SECRET
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.sso_issuer_url
          secretKeyRef: secret_string
          envVarName: SSO_ISSUER_URL
        - snowflakeSecret:
            objectName: spcs_app_db.app_schema.sso_redirect_uri
          secretKeyRef: secret_string
          envVarName: SSO_REDIRECT_URI
      readinessProbe:
        port: 8000
        path: /health
      resources:
        requests:
          memory: "512Mi"
          cpu: "0.5"
        limits:
          memory: "1Gi"
          cpu: "1"
  endpoints:
    - name: backend-endpoint
      port: 8000