worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # /api aur /health calls backend service pe proxy karo
        # "backend-service" = SPCS mein backend service ka naam
        # SPCS mein same schema ki services DNS se communicate karti hain
        location /api/ {
            proxy_pass http://backend-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://backend-service:8000;
        }

        # React SPA — koi bhi route → index.html serve karo
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}